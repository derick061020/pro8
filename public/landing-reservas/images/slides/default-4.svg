<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Fondo verde con ondas de marca">
  <title>Ondas</title>
  <defs>
    <linearGradient id="s4base" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="1800" y2="1080">
      <stop offset="0" stop-color="#0d1512"/>
      <stop offset=".42" stop-color="#152219"/>
      <stop offset=".74" stop-color="#1f3427"/>
      <stop offset="1" stop-color="#2c4a37"/>
    </linearGradient>
    <radialGradient id="s4glow" gradientUnits="userSpaceOnUse" cx="1392" cy="596" r="820">
      <stop offset="0" stop-color="#7fae91" stop-opacity=".42"/>
      <stop offset=".42" stop-color="#5c7c68" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3d5a49" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s4glow2" gradientUnits="userSpaceOnUse" cx="880" cy="792" r="420">
      <stop offset="0" stop-color="#7fae91" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3d5a49" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s4core" gradientUnits="userSpaceOnUse" cx="1392" cy="596" r="132">
      <stop offset="0" stop-color="#cfe6d7" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#8fbb9f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5c7c68" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s4sweep" gradientUnits="userSpaceOnUse" x1="0" y1="1080" x2="1920" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#e7f2ea" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s4hill" gradientUnits="userSpaceOnUse" x1="0" y1="760" x2="0" y2="1080">
      <stop offset="0" stop-color="#16241b"/>
      <stop offset="1" stop-color="#0b120e"/>
    </linearGradient>

    <linearGradient id="s4vtop" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="340">
      <stop offset="0" stop-color="#070c09" stop-opacity=".55"/>
      <stop offset="1" stop-color="#070c09" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s4vbot" gradientUnits="userSpaceOnUse" x1="0" y1="800" x2="0" y2="1080">
      <stop offset="0" stop-color="#070c09" stop-opacity="0"/>
      <stop offset="1" stop-color="#070c09" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="s4vleft" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="620" y2="0">
      <stop offset="0" stop-color="#070c09" stop-opacity=".5"/>
      <stop offset="1" stop-color="#070c09" stop-opacity="0"/>
    </linearGradient>

    <filter id="s4soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#s4base)"/>
  <circle cx="1392" cy="596" r="820" fill="url(#s4glow)"/>

  <!-- Resplandor secundario (sostiene el recorte estrecho en móvil) -->
  <circle cx="880" cy="792" r="420" fill="url(#s4glow2)"/>

  <!-- Ondas concéntricas (eco del loader de la marca) -->
  <g fill="none" stroke="#dff0e5" stroke-width="2">
    <circle cx="1392" cy="596" r="132" opacity=".30"/>
    <circle cx="1392" cy="596" r="228" opacity=".24"/>
    <circle cx="1392" cy="596" r="332" opacity=".19"/>
    <circle cx="1392" cy="596" r="452" opacity=".15"/>
    <circle cx="1392" cy="596" r="588" opacity=".12"/>
    <circle cx="1392" cy="596" r="742" opacity=".09"/>
    <circle cx="1392" cy="596" r="912" opacity=".07"/>
    <circle cx="1392" cy="596" r="1096" opacity=".05"/>
  </g>
  <!-- Ondas de acento, más marcadas en el arco izquierdo -->
  <g fill="none" stroke="#b7ddc6" stroke-width="3" stroke-linecap="round">
    <path d="M1392 264 A332 332 0 0 0 1060 596" opacity=".34"/>
    <path d="M1392 144 A452 452 0 0 0 940 596" opacity=".26"/>
    <path d="M1392 8 A588 588 0 0 0 804 596" opacity=".18"/>
  </g>

  <!-- Núcleo luminoso -->
  <circle cx="1392" cy="596" r="132" fill="url(#s4core)"/>
  <circle cx="1392" cy="596" r="46" fill="#8fbb9f" opacity=".45" filter="url(#s4soft)"/>
  <circle cx="1392" cy="596" r="26" fill="#e8f5ec" opacity=".7"/>

  <!-- Partículas suaves -->
  <g fill="#cfe6d7">
    <circle cx="612" cy="252" r="3" opacity=".35"/>
    <circle cx="826" cy="176" r="2.2" opacity=".28"/>
    <circle cx="418" cy="404" r="2.6" opacity=".22"/>
    <circle cx="1050" cy="300" r="2" opacity=".3"/>
    <circle cx="286" cy="196" r="2.4" opacity=".2"/>
    <circle cx="1698" cy="248" r="2.8" opacity=".3"/>
    <circle cx="1806" cy="452" r="2" opacity=".22"/>
    <circle cx="742" cy="828" r="2.6" opacity=".24"/>
    <circle cx="936" cy="470" r="2.8" opacity=".26"/>
    <circle cx="1012" cy="700" r="2.2" opacity=".22"/>
    <circle cx="860" cy="612" r="2" opacity=".2"/>
    <circle cx="1104" cy="892" r="2.2" opacity=".2"/>
  </g>

  <!-- Retícula de puntos (textura de marca) -->
  <g fill="#9dc4ab" opacity=".16">
    <circle cx="120" cy="700" r="3"/><circle cx="180" cy="700" r="3"/><circle cx="240" cy="700" r="3"/><circle cx="300" cy="700" r="3"/><circle cx="360" cy="700" r="3"/>
    <circle cx="120" cy="760" r="3"/><circle cx="180" cy="760" r="3"/><circle cx="240" cy="760" r="3"/><circle cx="300" cy="760" r="3"/><circle cx="360" cy="760" r="3"/>
    <circle cx="120" cy="820" r="3"/><circle cx="180" cy="820" r="3"/><circle cx="240" cy="820" r="3"/><circle cx="300" cy="820" r="3"/><circle cx="360" cy="820" r="3"/>
    <circle cx="120" cy="880" r="3"/><circle cx="180" cy="880" r="3"/><circle cx="240" cy="880" r="3"/><circle cx="300" cy="880" r="3"/><circle cx="360" cy="880" r="3"/>
  </g>

  <!-- Barrido de luz diagonal -->
  <rect width="1920" height="1080" fill="url(#s4sweep)"/>

  <!-- Colinas suaves al pie, para asentar la composición -->
  <path fill="url(#s4hill)" opacity=".9"
        d="M0 906 C260 838 520 866 792 904 C1082 944 1360 918 1620 872 C1740 850 1848 842 1920 848 L1920 1080 L0 1080 Z"/>
  <path fill="#5c7c68" opacity=".14"
        d="M0 906 C260 838 520 866 792 904 C1082 944 1360 918 1620 872 C1740 850 1848 842 1920 848 L1920 862 C1846 856 1740 864 1618 886 C1358 932 1080 958 790 918 C518 880 258 852 0 920 Z"/>
  <path fill="#0a110d"
        d="M0 1006 C300 962 620 990 940 1012 C1240 1032 1560 1018 1920 986 L1920 1080 L0 1080 Z"/>

  <!-- Viñeteado -->
  <rect width="1920" height="340" fill="url(#s4vtop)"/>
  <rect y="800" width="1920" height="280" fill="url(#s4vbot)"/>
  <rect width="620" height="1080" fill="url(#s4vleft)"/>
</svg>
