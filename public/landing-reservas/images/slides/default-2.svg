<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Habitación al anochecer">
  <title>Habitación</title>
  <defs>
    <linearGradient id="s2wall" gradientUnits="userSpaceOnUse" x1="1720" y1="120" x2="240" y2="1000">
      <stop offset="0" stop-color="#33291f"/>
      <stop offset=".38" stop-color="#231c16"/>
      <stop offset=".72" stop-color="#171310"/>
      <stop offset="1" stop-color="#100d0b"/>
    </linearGradient>
    <linearGradient id="s2floor" gradientUnits="userSpaceOnUse" x1="0" y1="852" x2="0" y2="1080">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>

    <!-- Vista desde la ventana: cielo de anochecer -->
    <linearGradient id="s2view" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="828">
      <stop offset="0" stop-color="#1d3350"/>
      <stop offset=".34" stop-color="#3d5570"/>
      <stop offset=".58" stop-color="#8a7071"/>
      <stop offset=".76" stop-color="#d59a68"/>
      <stop offset=".9" stop-color="#f3c489"/>
      <stop offset="1" stop-color="#fadfb2"/>
    </linearGradient>

    <radialGradient id="s2spill" gradientUnits="userSpaceOnUse" cx="1420" cy="620" r="950">
      <stop offset="0" stop-color="#ffcf95" stop-opacity=".32"/>
      <stop offset=".45" stop-color="#f0aa6b" stop-opacity=".12"/>
      <stop offset="1" stop-color="#e09455" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s2lamp" gradientUnits="userSpaceOnUse" cx="616" cy="330" r="320">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".6"/>
      <stop offset=".4" stop-color="#f2b072" stop-opacity=".2"/>
      <stop offset="1" stop-color="#e09a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s2light" gradientUnits="userSpaceOnUse" x1="1140" y1="0" x2="640" y2="0">
      <stop offset="0" stop-color="#ffcf94" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#f0b072" stop-opacity=".12"/>
      <stop offset="1" stop-color="#dc9a5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s2curtain" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="900">
      <stop offset="0" stop-color="#f7e1c0" stop-opacity=".30"/>
      <stop offset=".5" stop-color="#f2d6b4" stop-opacity=".20"/>
      <stop offset="1" stop-color="#e6c8a6" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="s2bed" gradientUnits="userSpaceOnUse" x1="0" y1="800" x2="0" y2="1080">
      <stop offset="0" stop-color="#33281d"/>
      <stop offset=".45" stop-color="#221a14"/>
      <stop offset="1" stop-color="#12100c"/>
    </linearGradient>
    <linearGradient id="s2head" gradientUnits="userSpaceOnUse" x1="0" y1="520" x2="0" y2="860">
      <stop offset="0" stop-color="#2b221a"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>

    <linearGradient id="s2vtop" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="320">
      <stop offset="0" stop-color="#0a0806" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0a0806" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s2vbot" gradientUnits="userSpaceOnUse" x1="0" y1="820" x2="0" y2="1080">
      <stop offset="0" stop-color="#0a0806" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0806" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="s2vleft" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="460" y2="0">
      <stop offset="0" stop-color="#0a0806" stop-opacity=".5"/>
      <stop offset="1" stop-color="#0a0806" stop-opacity="0"/>
    </linearGradient>

    <filter id="s2soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="s2soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Pared y piso -->
  <rect width="1920" height="1080" fill="url(#s2wall)"/>
  <rect y="852" width="1920" height="228" fill="url(#s2floor)"/>
  <rect y="846" width="1920" height="8" fill="#3c3025" opacity=".45"/>

  <!-- Luz de la ventana proyectada sobre la pared -->
  <g filter="url(#s2soft)" opacity=".85">
    <path fill="url(#s2light)" d="M1140 214 L1140 470 L676 556 L700 322 Z"/>
    <path fill="url(#s2light)" d="M1140 508 L1140 792 L648 826 L672 596 Z"/>
  </g>

  <!-- Ventana -->
  <g>
    <rect x="1148" y="150" width="656" height="678" rx="10" fill="url(#s2view)"/>
    <!-- Colinas lejanas dentro de la vista -->
    <path d="M1148 690 L1284 636 L1400 682 L1540 620 L1672 686 L1804 646 L1804 828 L1148 828 Z" fill="#4a3f47" opacity=".5"/>
    <path d="M1148 742 L1310 700 L1462 750 L1626 706 L1804 754 L1804 828 L1148 828 Z" fill="#2f2a31" opacity=".65"/>
    <!-- Luces del pueblo -->
    <g fill="#ffd9a0" opacity=".75">
      <circle cx="1246" cy="770" r="3"/><circle cx="1322" cy="786" r="2.4"/>
      <circle cx="1408" cy="764" r="2.8"/><circle cx="1498" cy="790" r="2.4"/>
      <circle cx="1588" cy="762" r="3"/><circle cx="1690" cy="784" r="2.6"/>
      <circle cx="1756" cy="768" r="2.4"/>
    </g>
    <!-- Marco y montantes -->
    <rect x="1148" y="150" width="656" height="678" rx="10" fill="none" stroke="#0d0b09" stroke-width="18"/>
    <rect x="1466" y="150" width="16" height="678" fill="#0d0b09"/>
    <rect x="1148" y="470" width="656" height="14" fill="#0d0b09"/>
    <!-- Alféizar -->
    <rect x="1112" y="826" width="728" height="22" rx="7" fill="#2e2419"/>
    <rect x="1112" y="826" width="728" height="5" rx="2" fill="#5b452e" opacity=".65"/>
  </g>

  <!-- Cortinas: caen a ambos lados y cubren el borde de la ventana -->
  <g filter="url(#s2soft2)">
    <path fill="url(#s2curtain)"
          d="M1076 120 C1120 300 1096 520 1132 700 C1156 812 1140 852 1170 900 L1296 900 C1268 700 1272 420 1256 120 Z"/>
    <path fill="#fff1d8" opacity=".05"
          d="M1180 120 C1206 320 1190 560 1218 800 C1232 866 1226 880 1242 900 L1296 900 C1268 700 1272 420 1256 120 Z"/>
    <path fill="url(#s2curtain)" opacity=".8"
          d="M1690 120 C1704 380 1692 640 1716 900 L1856 900 C1836 640 1842 360 1846 120 Z"/>
  </g>

  <!-- Halo cálido general que emite la ventana -->
  <circle cx="1420" cy="620" r="950" fill="url(#s2spill)"/>

  <!-- Luz derramada sobre el piso -->
  <g filter="url(#s2soft)" opacity=".55">
    <path d="M1180 852 L1810 852 L1520 1080 L560 1080 Z" fill="#f2b878" opacity=".2"/>
    <path d="M1200 852 L1470 852 L1250 1080 L740 1080 Z" fill="#ffd7a2" opacity=".14"/>
  </g>

  <!-- Lámpara colgante -->
  <g>
    <circle cx="616" cy="330" r="320" fill="url(#s2lamp)"/>
    <rect x="613" y="0" width="6" height="252" fill="#2b241d"/>
    <path d="M556 252 L676 252 L648 324 L584 324 Z" fill="#241d17"/>
    <path d="M560 256 L672 256 L666 262 L566 262 Z" fill="#4a3c2c" opacity=".7"/>
    <path d="M584 324 L648 324 L642 332 L590 332 Z" fill="#ffcf95" opacity=".9"/>
    <ellipse cx="616" cy="336" rx="40" ry="11" fill="#ffdcac" opacity=".5" filter="url(#s2soft2)"/>
  </g>

  <!-- Cabecera tapizada -->
  <g>
    <path fill="url(#s2head)" d="M84 566 C84 546 100 532 122 532 L742 532 C764 532 780 546 780 566 L780 838 L84 838 Z"/>
    <g stroke="#4a3a2a" stroke-width="2" opacity=".35">
      <path d="M200 546 L200 838"/><path d="M316 542 L316 838"/><path d="M432 540 L432 838"/>
      <path d="M548 542 L548 838"/><path d="M664 546 L664 838"/>
    </g>
    <path fill="#6b5238" opacity=".28" d="M84 566 C84 546 100 532 122 532 L742 532 C764 532 780 546 780 566 L780 574 C780 554 764 542 742 542 L122 542 C100 542 84 554 84 574 Z"/>
  </g>

  <!-- Mesa de noche con lámpara pequeña -->
  <g>
    <rect x="836" y="742" width="150" height="110" rx="8" fill="#221a14"/>
    <rect x="836" y="742" width="150" height="6" rx="3" fill="#5a462f" opacity=".55"/>
    <rect x="900" y="700" width="8" height="44" fill="#2d241b"/>
    <path d="M868 656 L940 656 L952 700 L856 700 Z" fill="#2a2119"/>
    <path d="M858 696 L950 696 L952 700 L856 700 Z" fill="#ffcf95" opacity=".75"/>
    <circle cx="904" cy="712" r="120" fill="#ffcf95" opacity=".10" filter="url(#s2soft)"/>
  </g>

  <!-- Cama insinuada en primer plano -->
  <g>
    <path fill="url(#s2bed)" d="M-40 872 C240 828 560 820 828 848 C980 864 1050 894 1080 936 L1080 1080 L-40 1080 Z"/>
    <path fill="#6a563d" opacity=".38" d="M-40 872 C240 828 560 820 828 848 C980 864 1050 894 1080 936 L1080 950 C1030 902 962 876 812 860 C556 834 240 842 -40 886 Z"/>
    <!-- Almohadas -->
    <path fill="#2a2018" d="M116 852 C196 820 316 812 392 830 C438 842 452 866 430 884 C356 866 214 866 116 888 Z"/>
    <path fill="#7a6448" opacity=".32" d="M116 852 C196 820 316 812 392 830 C438 842 452 866 430 884 L424 876 C398 846 244 840 120 866 Z"/>
    <path fill="#241b14" d="M468 848 C540 822 646 816 714 832 C754 842 768 862 748 878 C682 862 556 862 468 882 Z"/>
    <path fill="#6b573e" opacity=".26" d="M468 848 C540 822 646 816 714 832 C754 842 768 862 748 878 L742 870 C718 846 580 840 470 862 Z"/>
    <!-- Manta cruzada -->
    <path fill="#171310" opacity=".85" d="M-40 966 C260 928 620 936 940 986 L1060 1010 L1080 1080 L-40 1080 Z"/>
    <path fill="#7d6547" opacity=".18" d="M-40 966 C260 928 620 936 940 986 L1060 1010 L1060 1020 L936 996 C618 946 260 940 -40 978 Z"/>
  </g>

  <!-- Planta en la esquina derecha -->
  <g fill="#141410">
    <path d="M1806 1080 C1798 962 1818 878 1862 806 C1848 900 1846 990 1852 1080 Z"/>
    <path d="M1856 946 C1790 908 1748 848 1734 774 C1794 818 1840 874 1866 940 Z"/>
    <path d="M1868 918 C1900 848 1894 780 1866 720 C1900 762 1922 830 1916 902 Z"/>
    <path d="M1862 862 C1810 826 1780 776 1772 716 C1818 752 1850 800 1872 856 Z"/>
    <path d="M1872 1080 C1888 986 1922 916 1920 830 L1920 1080 Z"/>
  </g>

  <!-- Viñeteado -->
  <rect width="1920" height="320" fill="url(#s2vtop)"/>
  <rect y="820" width="1920" height="260" fill="url(#s2vbot)"/>
  <rect width="460" height="1080" fill="url(#s2vleft)"/>
</svg>
