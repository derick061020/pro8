<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Amanecer sobre las montañas">
  <title>Amanecer</title>
  <defs>
    <linearGradient id="s1sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="830">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".26" stop-color="#1b293c"/>
      <stop offset=".48" stop-color="#3e4257"/>
      <stop offset=".64" stop-color="#775763"/>
      <stop offset=".78" stop-color="#b8765d"/>
      <stop offset=".9" stop-color="#e0a071"/>
      <stop offset="1" stop-color="#f6cd9b"/>
    </linearGradient>
    <radialGradient id="s1sun" gradientUnits="userSpaceOnUse" cx="1352" cy="712" r="470">
      <stop offset="0" stop-color="#ffdcaa" stop-opacity=".85"/>
      <stop offset=".32" stop-color="#f4a768" stop-opacity=".34"/>
      <stop offset="1" stop-color="#e08a55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s1disc" gradientUnits="userSpaceOnUse" cx="1352" cy="618" r="92">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".62" stop-color="#ffeecb"/>
      <stop offset="1" stop-color="#ffdba4" stop-opacity=".9"/>
    </radialGradient>

    <!-- Bruma entre cordilleras: da profundidad atmosférica. -->
    <linearGradient id="s1haze1" gradientUnits="userSpaceOnUse" x1="0" y1="596" x2="0" y2="792">
      <stop offset="0" stop-color="#f4cba1" stop-opacity="0"/>
      <stop offset=".5" stop-color="#efc096" stop-opacity=".30"/>
      <stop offset="1" stop-color="#e8b58c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s1haze2" gradientUnits="userSpaceOnUse" x1="0" y1="740" x2="0" y2="930">
      <stop offset="0" stop-color="#e9b992" stop-opacity="0"/>
      <stop offset=".5" stop-color="#dda884" stop-opacity=".22"/>
      <stop offset="1" stop-color="#cf9a79" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="s1r1" gradientUnits="userSpaceOnUse" x1="0" y1="580" x2="0" y2="900">
      <stop offset="0" stop-color="#6b5f70"/>
      <stop offset="1" stop-color="#4c4a60"/>
    </linearGradient>
    <linearGradient id="s1r2" gradientUnits="userSpaceOnUse" x1="0" y1="680" x2="0" y2="1000">
      <stop offset="0" stop-color="#3f3d51"/>
      <stop offset="1" stop-color="#2c2c3c"/>
    </linearGradient>
    <linearGradient id="s1r3" gradientUnits="userSpaceOnUse" x1="0" y1="800" x2="0" y2="1080">
      <stop offset="0" stop-color="#24252f"/>
      <stop offset="1" stop-color="#191a22"/>
    </linearGradient>

    <linearGradient id="s1vtop" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="340">
      <stop offset="0" stop-color="#080d16" stop-opacity=".55"/>
      <stop offset="1" stop-color="#080d16" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s1vbot" gradientUnits="userSpaceOnUse" x1="0" y1="820" x2="0" y2="1080">
      <stop offset="0" stop-color="#0d1017" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1017" stop-opacity=".75"/>
    </linearGradient>

    <filter id="s1blur" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="s1blurSoft" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Cielo -->
  <rect width="1920" height="1080" fill="url(#s1sky)"/>

  <!-- Estrellas que aún se ven en lo alto -->
  <g fill="#e8eefc">
    <circle cx="182" cy="96" r="2.1" opacity=".55"/>
    <circle cx="352" cy="188" r="1.6" opacity=".38"/>
    <circle cx="596" cy="78" r="1.9" opacity=".45"/>
    <circle cx="742" cy="212" r="1.4" opacity=".3"/>
    <circle cx="968" cy="122" r="2.2" opacity=".5"/>
    <circle cx="1188" cy="72" r="1.5" opacity=".34"/>
    <circle cx="1394" cy="176" r="1.8" opacity=".3"/>
    <circle cx="1612" cy="104" r="2" opacity=".42"/>
    <circle cx="1782" cy="212" r="1.5" opacity=".26"/>
    <circle cx="466" cy="292" r="1.3" opacity=".22"/>
  </g>

  <!-- Sol bajo y su halo -->
  <circle cx="1352" cy="712" r="470" fill="url(#s1sun)"/>
  <circle cx="1352" cy="618" r="90" fill="url(#s1disc)"/>

  <!-- Nubes alargadas (desenfocadas) teñidas por el amanecer -->
  <g filter="url(#s1blur)">
    <ellipse cx="1420" cy="470" rx="360" ry="26" fill="#c98a72" opacity=".38"/>
    <ellipse cx="1180" cy="536" rx="430" ry="22" fill="#dda07f" opacity=".32"/>
    <ellipse cx="520" cy="418" rx="330" ry="24" fill="#7f6a80" opacity=".38"/>
    <ellipse cx="820" cy="596" rx="520" ry="20" fill="#e0a883" opacity=".26"/>
    <ellipse cx="260" cy="560" rx="300" ry="18" fill="#c78d78" opacity=".22"/>
  </g>

  <!-- Aves -->
  <g fill="none" stroke="#2b2733" stroke-width="3.4" stroke-linecap="round" opacity=".5">
    <path d="M690 352c9-9 18-9 26 0 8-9 17-9 26 0"/>
    <path d="M776 316c7-7 14-7 20 0 6-7 13-7 20 0" stroke-width="2.8"/>
    <path d="M842 380c6-6 11-6 16 0 5-6 10-6 15 0" stroke-width="2.4"/>
  </g>

  <!-- Cordillera lejana -->
  <path fill="url(#s1r1)" opacity=".82"
        d="M0 706 L238 604 L392 678 L556 566 L714 668 L900 596 L1064 690 L1248 610 L1436 700 L1618 628 L1782 704 L1920 656 L1920 1080 L0 1080 Z"/>
  <rect x="0" y="596" width="1920" height="196" fill="url(#s1haze1)"/>

  <!-- Cordillera media -->
  <path fill="url(#s1r2)" opacity=".95"
        d="M0 812 L196 716 L376 818 L590 700 L788 812 L986 736 L1204 828 L1414 742 L1626 834 L1808 760 L1920 812 L1920 1080 L0 1080 Z"/>
  <rect x="0" y="740" width="1920" height="190" fill="url(#s1haze2)"/>

  <!-- Cordillera cercana -->
  <path fill="url(#s1r3)"
        d="M0 926 L268 846 L512 940 L790 856 L1046 950 L1330 866 L1602 954 L1830 884 L1920 928 L1920 1080 L0 1080 Z"/>

  <!-- Ladera en primer plano -->
  <path fill="#101219"
        d="M0 1024 L322 972 L648 1034 L1002 984 L1372 1042 L1704 992 L1920 1032 L1920 1080 L0 1080 Z"/>

  <!-- Reflejo cálido del sol sobre la cresta cercana -->
  <g filter="url(#s1blurSoft)" opacity=".5">
    <path d="M1330 866 L1602 954 L1596 962 L1330 878 Z" fill="#f0b981"/>
    <path d="M1046 950 L1330 866 L1334 876 L1052 958 Z" fill="#e5a878"/>
  </g>

  <!-- Viñeteado -->
  <rect width="1920" height="340" fill="url(#s1vtop)"/>
  <rect y="820" width="1920" height="260" fill="url(#s1vbot)"/>
</svg>
