# MariaDB embebido del terminal pro8.
#
# Pensado para una PC de tienda: poca RAM, un solo usuario, y sobre todo que
# no se corrompa la base cuando alguien apaga el equipo desde la llave.

[mysqld]
port = 3399
bind-address = 127.0.0.1

character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci

# El sistema trae consultas con GROUP BY parcial heredadas; sin esto varias
# pantallas de reportes fallan.
sql_mode = "NO_ENGINE_SUBSTITUTION"

default-storage-engine = InnoDB
innodb_file_per_table = 1

# Ajustado a equipos de 4 GB, que es lo que suele haber en una caja.
innodb_buffer_pool_size = 256M
innodb_log_file_size = 64M

# Durabilidad por encima de velocidad: en una PC sin UPS, perder la última
# venta por un corte de luz no es aceptable.
innodb_flush_log_at_trx_commit = 1
sync_binlog = 1

max_connections = 50
max_allowed_packet = 128M

# Restaurar el respaldo del servidor puede tardar; que no corte a mitad.
net_read_timeout = 600
net_write_timeout = 600
wait_timeout = 28800

skip-name-resolve
skip-external-locking

[client]
port = 3399
default-character-set = utf8mb4
