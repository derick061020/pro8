; PHP del terminal pro8.
;
; Las extensiones no son opcionales: soap, openssl y xsl son las que usa la
; facturación electrónica para firmar y enviar comprobantes a SUNAT, y sin
; ellas el terminal arranca pero no puede emitir.

[PHP]
extension_dir = "ext"

; bcmath no se lista: en las compilaciones de Windows viene dentro de php8.dll,
; no como DLL suelta, y pedirla acá solo deja un aviso en el log de arranque.
extension=curl
extension=exif
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=soap
extension=sockets
extension=sodium
extension=xsl
extension=zip

; Una venta con muchos items o un respaldo grande no puede morir por límites.
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 100M
upload_max_filesize = 100M
max_input_vars = 5000

date.timezone = America/Lima

; En una PC de tienda nadie va a leer errores en pantalla; van al log.
display_errors = Off
log_errors = On
error_log = "../logs/php-error.log"

expose_php = Off

[opcache]
; Acelera bastante en equipos modestos, que es el caso típico.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Se revalida solo cada 60s: tras una actualización el launcher reinicia PHP,
; así que no hace falta chequear en cada request.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

[curl]
curl.cainfo = "../config/cacert.pem"

[openssl]
openssl.cafile = "../config/cacert.pem"
